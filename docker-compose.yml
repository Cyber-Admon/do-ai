services:
  db:
    image: postgres:16
    container_name: do-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - do_pgdata:/var/lib/postgresql/data
    networks:
      - do_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: do-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - do_net

volumes:
  do_pgdata:

networks:
  do_net: